<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t d"><title id="t">Movie_Recommender animated workflow</title><desc id="d">Animated workflow with four project-specific stages.</desc><rect width="1200" height="390" rx="18" fill="#F4F0E6"/><text x="56" y="42" fill="#263A4B" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">SYSTEM FLOW / ANIMATED</text><text x="56" y="80" fill="#202B37" font-family="Arial,sans-serif" font-size="26" font-weight="700">Movie_Recommender</text><text x="56" y="108" fill="#6D7779" font-family="Arial,sans-serif" font-size="14">Follow the moving markers through the project workflow</text><line x1="56" y1="128" x2="1144" y2="128" stroke="#D9D5C9"/><path d="M 288 236 H 334" stroke="#6D7779" stroke-width="1.8"/><path d="M 328 231 L 334 236 L 328 241" fill="none" stroke="#6D7779" stroke-width="1.8"/><path d="M 576 236 H 622" stroke="#6D7779" stroke-width="1.8"/><path d="M 616 231 L 622 236 L 616 241" fill="none" stroke="#6D7779" stroke-width="1.8"/><path d="M 864 236 H 910" stroke="#6D7779" stroke-width="1.8"/><path d="M 904 231 L 910 236 L 904 241" fill="none" stroke="#6D7779" stroke-width="1.8"/><g><rect x="56" y="154" width="224" height="164" rx="12" fill="#FFFEFA" stroke="#D9D5C9" stroke-width="1.4"/><rect x="56" y="154" width="224" height="5" rx="2.5" fill="#263A4B"/><text x="72" y="184" fill="#263A4B" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">SELECT A FILM</text><text x="72" y="219" fill="#202B37" font-family="Arial,sans-serif" font-size="16" font-weight="700">Search a title</text><text x="72" y="248" fill="#6D7779" font-family="Arial,sans-serif" font-size="12">Choose a movie in the app.</text><circle cx="260" cy="179" r="4" fill="#263A4B"><animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/></circle></g><g><rect x="344" y="154" width="224" height="164" rx="12" fill="#FFFEFA" stroke="#D9D5C9" stroke-width="1.4"/><rect x="344" y="154" width="224" height="5" rx="2.5" fill="#263A4B"/><text x="360" y="184" fill="#263A4B" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">COMBINE TAGS</text><text x="360" y="219" fill="#202B37" font-family="Arial,sans-serif" font-size="16" font-weight="700">Metadata into text</text><text x="360" y="248" fill="#6D7779" font-family="Arial,sans-serif" font-size="12">Genres, cast, crew, and overview.</text><circle cx="548" cy="179" r="4" fill="#263A4B"><animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/></circle></g><g><rect x="632" y="154" width="224" height="164" rx="12" fill="#FFFEFA" stroke="#D9D5C9" stroke-width="1.4"/><rect x="632" y="154" width="224" height="5" rx="2.5" fill="#B28B50"/><text x="648" y="184" fill="#B28B50" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">SCORE SIMILARITY</text><text x="648" y="219" fill="#202B37" font-family="Arial,sans-serif" font-size="16" font-weight="700">Vectorise and compare</text><text x="648" y="248" fill="#6D7779" font-family="Arial,sans-serif" font-size="12">CountVectorizer + cosine similarity.</text><circle cx="836" cy="179" r="4" fill="#B28B50"><animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite"/></circle></g><g><rect x="920" y="154" width="224" height="164" rx="12" fill="#FFFEFA" stroke="#D9D5C9" stroke-width="1.4"/><rect x="920" y="154" width="224" height="5" rx="2.5" fill="#263A4B"/><text x="936" y="184" fill="#263A4B" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">RANK RESULTS</text><text x="936" y="219" fill="#202B37" font-family="Arial,sans-serif" font-size="16" font-weight="700">Top similar titles</text><text x="936" y="248" fill="#6D7779" font-family="Arial,sans-serif" font-size="12">Return recommendations with details.</text><circle cx="1124" cy="179" r="4" fill="#263A4B"><animate attributeName="r" values="3;5;3" dur="3.2s" repeatCount="indefinite"/></circle></g><circle r="4.5" fill="#263A4B"><animateMotion dur="7s" repeatCount="indefinite" path="M 288 236 L 344 236 L 568 236 L 632 236 L 856 236 L 920 236"/></circle><circle r="3" fill="#B28B50"><animateMotion dur="7s" begin="-3.5s" repeatCount="indefinite" path="M 288 236 L 344 236 L 568 236 L 632 236 L 856 236 L 920 236"/></circle><text x="56" y="358" fill="#6D7779" font-family="Arial,sans-serif" font-size="12">Animated SVG preview. Open architecture.html for interactive stage details.</text></svg>